# Free preview Blueprint: the web service sleeps after 15 idle minutes;
# PostgreSQL expires after 30 days. Back up or upgrade before expiry.
# Render supplies the public URL automatically. Set APP_ORIGIN separately
# only when using a custom domain. Reuse existing keys when restoring data.
services:
  - type: web
    name: webinar-studio
    runtime: node
    branch: main
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    # Free services cannot use preDeployCommand. Serve only after migrations.
    startCommand: npm run db:migrate:deploy && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: webinar-studio-db
          property: connectionString
      - key: REGISTRATION_SECRET
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: CADENCE_AUTOTICK
        value: 'false'
      - key: CADENCE_AUTOTICK_SECONDS
        value: '300'
      - key: ZOOM_AUTOSYNC
        value: 'false'
      - key: ZOOM_AUTOSYNC_SECONDS
        value: '300'
      # Configure provider credentials on Integrations after setting the keys.
databases:
  - name: webinar-studio-db
    plan: free
    postgresMajorVersion: '16'
    databaseName: webinar_studio
    user: webinar_studio
