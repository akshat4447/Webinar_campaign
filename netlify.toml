# Set Node 24, PostgreSQL, persistent signing/encryption keys, and APP_ORIGIN.
# Run database migrations in a separate release step before serving new code.
# Schedule GET /api/cron/cadence; persistent timers are unavailable in serverless functions.
[build]
  command = "npm run build"
[build.environment]
  NODE_VERSION = "24"
[[plugins]]
  package = "@netlify/plugin-nextjs"
