# Apply only after approving the paid compute plans in Render.
# Existing resource names preserve the current application/database.
services:
  - type: web
    name: webinar-studio
    runtime: node
    branch: main
    plan: 1c-2g
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: webinar-studio-db
          property: connectionString
      - key: REGISTRATION_SECRET
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: CRON_SECRET
        sync: false
      # Always-on server; the single database-leased timer drives all durable work.
      - key: CADENCE_AUTOTICK
        value: 'true'
      - key: CADENCE_AUTOTICK_SECONDS
        value: '300'
      - key: ZOOM_AUTOSYNC
        value: 'true'
databases:
  - name: webinar-studio-db
    plan: 0.5c-1g
    postgresMajorVersion: '16'
    databaseName: webinar_studio
    user: webinar_studio
    diskSizeGB: 5
