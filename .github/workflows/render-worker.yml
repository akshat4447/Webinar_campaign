name: Render worker

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: render-worker
  cancel-in-progress: false

jobs:
  tick:
    if: vars.RENDER_WORKER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CRON_SECRET: ${{ secrets.RENDER_CRON_SECRET }}
    steps:
      # No checkout or third-party action receives the worker credential.
      - name: Invoke the authenticated worker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const secret = process.env.CRON_SECRET;
          if (!secret || secret.length < 32) throw new Error('Worker secret is missing or too short.');
          try {
            const response = await fetch('https://webinar-studio.onrender.com/api/cron/cadence', {
              headers: { Authorization: `Bearer ${secret}` },
              redirect: 'error',
              signal: AbortSignal.timeout(180_000),
            });
            if (!response.ok) throw new Error(`Worker returned HTTP ${response.status}.`);
            const result = await response.json();
            if (result.ok !== true) throw new Error('Worker reported a failure.');
            console.log(JSON.stringify({ ok: true, skipped: Boolean(result.skipped), processed: result.processed ?? 0, sent: result.sent ?? 0, failed: result.failed ?? 0 }));
          } catch (error) {
            // A timeout means the site never answered, which on the free plan usually means the service cannot start
            // (most often an expired free database), so say where to look instead of only "aborted due to timeout".
            const message = error instanceof Error && error.name === 'TimeoutError'
              ? 'Webinar Studio did not respond within 3 minutes. The Render service is probably failing to start: check its logs and /api/health, and whether the free database has expired (see docs/DEPLOYMENT.md, "Replace an expired free database").'
              : error instanceof Error ? error.message : 'Worker request failed.';
            console.log(`::error title=Render worker::${message}`);
            process.exitCode = 1;
          }
          NODE
