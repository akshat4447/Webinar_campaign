services:
  - type: web
    name: webinar-studio
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma migrate deploy && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: webinar-studio-db
          property: connectionString
      - key: NODE_VERSION
        value: 20.18.0
      # Single instance only — see the README's "Background automation" note.
      # Safe to leave on for a one-instance web service; do NOT also run the
      # cadence-tick cron job below with this set, or sends get double-processed.
      - key: ZOOM_AUTOSYNC
        value: "1"
      - key: ZOOM_AUTOSYNC_SECONDS
        value: "300"
      # Secrets and per-integration credentials — fill in from the Render
      # dashboard after the first deploy (sync: false means Render prompts for
      # a value instead of reading one from this file). Everything below can
      # also be set later from the app's own Integrations page instead, which
      # always wins over these env vars.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LSQ_ACCESS_KEY
        sync: false
      - key: LSQ_SECRET_KEY
        sync: false
      - key: LSQ_HOST
        sync: false
      - key: LSQ_SENDER_EMAIL
        sync: false
      - key: APOLLO_API_KEY
        sync: false
      - key: SEND_ALLOWLIST_LEAD_EMAIL
        sync: false
      # Flip to "live" only once templates/sender identity are verified —
      # see the README before changing this.
      - key: SEND_MODE
        value: sandbox
      - key: ZOOM_CLIENT_ID
        sync: false
      - key: ZOOM_CLIENT_SECRET
        sync: false
      - key: ZOOM_MODE
        value: sandbox
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_MODE
        value: sandbox
      - key: LINKEDIN_ORGANIZATION_URN
        sync: false
      - key: LINKEDIN_VERSION
        value: "202608"
      - key: REGISTRATION_SECRET
        sync: false
      # Render sets its own https://<service>.onrender.com — replace with a
      # custom domain here if you attach one, so absolute links (one-click
      # registration, .ics downloads, OAuth redirects) build correctly.
      - key: APP_ORIGIN
        sync: false
      # Shared with the cadence-cron job below — set the SAME value on both
      # services after the first deploy. Protects /api/cron/cadence from
      # being triggered by anyone who finds the URL.
      - key: CRON_SECRET
        sync: false

  # Drives scheduled cadence sends by calling the app's own /api/cron/cadence
  # endpoint (app/api/cron/cadence/route.ts) rather than running a second copy
  # of the app as a background worker — no separate build, no second
  # DATABASE_URL connection pool, and the same endpoint Vercel Cron uses
  # (see vercel.json) if you ever deploy there too. This replaces relying on
  # the web service's own in-process CADENCE_AUTOTICK timer, which stops when
  # that process restarts and would double-process sends if the service ever
  # scaled past one instance — leave CADENCE_AUTOTICK unset above while this
  # is enabled.
  - type: cron
    name: webinar-studio-cadence-cron
    runtime: node
    plan: free
    schedule: "*/5 * * * *"
    buildCommand: "true"
    startCommand: 'curl -sf -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/cadence"'
    envVars:
      - key: CRON_SECRET
        sync: false
      # Update if you rename the web service above or attach a custom domain.
      - key: APP_URL
        value: https://webinar-studio.onrender.com

databases:
  - name: webinar-studio-db
    plan: free
    databaseName: webinar_studio
    user: webinar_studio
