# Production blueprint: paid always-on web service and non-expiring PostgreSQL.
# Applying this file provisions billable resources; committing it does not.
services:
  - type: web
    name: webinar-studio
    runtime: node
    branch: main
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate:deploy
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        fromDatabase:
          name: webinar-studio-db
          property: connectionString
      - key: APP_ORIGIN
        sync: false
      - key: REGISTRATION_SECRET
        sync: false
      - key: CREDENTIALS_ENCRYPTION_KEY
        sync: false
      - key: CADENCE_AUTOTICK
        value: 'true'
      - key: CADENCE_AUTOTICK_SECONDS
        value: '300'
      - key: ZOOM_AUTOSYNC
        value: 'true'
      - key: ZOOM_AUTOSYNC_SECONDS
        value: '300'
      # Configure provider credentials on Integrations after setting the keys.
databases:
  - name: webinar-studio-db
    plan: 0.1c-256mb
    postgresMajorVersion: '16'
    diskSizeGB: 5
    databaseName: webinar_studio
    user: webinar_studio
